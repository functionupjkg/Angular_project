<form *ngIf="userForm" [formGroup]="userForm" (ngSubmit)="onSubmit()" class="form-container">
  <div class="form-group">
    <label>Name:</label>
    <input type="text" formControlName="name" />
    <div *ngIf="userForm.get('name')?.touched && userForm.get('name')?.invalid">
      <small class="error">Name is required.</small>
    </div>
  </div>

  <div class="form-group">
    <label>Email:</label>
    <input type="email" formControlName="email" />
    <div *ngIf="userForm.get('email')?.touched && userForm.get('email')?.invalid">
      <small class="error">Valid email is required.</small>
    </div>
  </div>

  <div class="form-group">
    <label>Password:</label>
    <input type="password" formControlName="password" />
    <div *ngIf="userForm.get('password')?.touched && userForm.get('password')?.invalid">
      <small class="error">Min 6 characters required.</small>
    </div>
  </div>

  <div class="form-group">
    <label>Mobile:</label>
    <input type="text" formControlName="mobile" />
    <div *ngIf="userForm.get('mobile')?.touched && userForm.get('mobile')?.invalid">
      <small class="error">Valid 10-digit mobile required.</small>
    </div>
  </div>

  <div class="form-buttons">
    <button type="submit" [disabled]="userForm.invalid">{{isEditMode ? 'Update' : 'Submit'}}</button>
    <button type="button" (click)="onReset()">Refresh</button>
  </div>
</form>

<!-- =========================  Show listing table here ================ -->
<br>

<div class="table-container">
  <table class="styled-table" *ngIf="submittedDataList.length > 0">
    <thead>
      <tr>
        <th>Sl. No.</th>
        <th>Name</th>
        <th>Mobile No.</th>
        <th>Email Id</th>
        <th>Password</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let data of submittedDataList; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ data.name }}</td>
        <td>{{ data.mobile }}</td>
        <td>{{ data.email }}</td>
        <td>{{ data.password }}</td>
        <td>
          <button class="icon-btn" (click)="editRow(i)" title="Edit">
            <mat-icon color="primary">edit</mat-icon>
          </button>

          <button class="icon-btn" (click)="deleteRow(i)" title="Delete">
            <mat-icon color="warn">delete </mat-icon>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
